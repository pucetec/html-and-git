<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BurgerHouse</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* Navbar */
    .navbar {
      height: 60px;
      background-color: #c8e6c9; /* verde claro */
      border-radius: 12px;
      margin: 8px;
    }

    /* Hero / Banner principal */
    .hero {
      height: 200px;
      background-color: #f8bbd0; /* rosa claro */
      border-radius: 12px;
      margin: 8px;
    }

    /* Productos destacados */
    .productos {
      height: 250px;
      background-color: #bbdefb; /* azul claro */
      border-radius: 12px;
      margin: 8px;
    }

    /* Promociones */
    .promociones {
      height: 200px;
      background-color: #fff9c4; /* amarillo claro */
      border-radius: 12px;
      margin: 8px;
    }

    /* Footer */
    .footer {
      height: 100px;
      background-color: #6200ea; /* violeta / morado */
      border-radius: 12px;
      margin: 8px;
    }
  </style>
</head>
<body>

  <!-- Sección 1: Barra de navegación -->
  <div class="navbar"></div>

  <!-- Sección 2: Hero / Banner principal -->
  <div class="hero"></div>

  <!-- Sección 3: Productos destacados -->
  <div class="productos"></div>

  <!-- Sección 4: Promociones -->
  <div class="promociones"></div>

  <!-- Sección 5: Footer -->
  <div class="footer"></div>

</body>
</html>
