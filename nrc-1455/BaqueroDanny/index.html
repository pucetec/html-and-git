<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BurgerHouse</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .navbar {
      height: 60px;
      background-color: #c8e6c9; 
      border-radius: 12px;
      margin: 8px;
    }

    .hero {
      height: 200px;
      background-color: #f8bbd0; 
      border-radius: 12px;
      margin: 8px;
    }

    .productos {
      height: 250px;
      background-color: #bbdefb; 
      border-radius: 12px;
      margin: 8px;
    }

    .promociones {
      height: 200px;
      background-color: #fff9c4; 
      border-radius: 12px;
      margin: 8px;
    }

    .footer {
      height: 100px;
      background-color: #6200ea; 
      border-radius: 12px;
      margin: 8px;
    }
  </style>
</head>
<body>

  <div class="navbar"></div>

  <div class="hero"></div>

  <div class="productos"></div>

  <div class="promociones"></div>

  <div class="footer"></div>

</body>
</html>
