<!DOCTYPE html>
<html lang="es">

<head>

    <title>LAS MEJORES HAMBURGUESAS</title>

    <style>

        body{
            margin: 0;
            background: #f2f2f2;
            font-family: Arial;
        }

        .contenedor{
            width: 95%;
            margin: auto;
        }

        div{
            border-radius: 25px;
            margin-top: 10px;
            font-size: 35px;
            font-weight: bold;
        }

        .header{
            height: 100px;
            background: #cfe3cf;
            border: 2px solid green;
        }

        .banner{
            height: 220px;
            background: #f4caca;
            border: 2px solid brown;
        }

        .productos{
            height: 280px;
            background: #cfd9ec;
            border: 2px solid steelblue;
        }

        .promociones{
            height: 250px;
            background: #efe4be;
            border: 2px solid goldenrod;
        }

        .footer{
            height: 150px;
            background: blueviolet;
            border: 2px solid darkblue;
            color: white;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="header">
            HEADER
        </div>

        <div class="banner">
            LAS MEJORES HAMBURGUESAS
        </div>

        <div class="productos">
            PRODUCTOS DESTACADOS
        </div>

        <div class="promociones">
            PROMOCIONES
        </div>

        <div class="footer">
            FOOTER
        </div>

    </div>

</body>

</html>
