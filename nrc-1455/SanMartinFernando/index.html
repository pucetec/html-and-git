<!DOCTYPE html>   
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurgerFactory</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between; /* Logo izquierda y menú derecha */

            padding: 0 20px;
            background-color: red; /* Fondo rojo solo para logo y menú */
            height: 50px;
        }

        .logo {
            font-weight: bold;
            color: white;
        }

        .menu {
            display: flex;
            gap: 15px;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        } 
        .hero {
    background-color: #ff0000;
    color: white;
    text-align: center;
    padding: 60px 20px;
}
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">BurgerFactory</div>

        <div class="menu">
            <a href="#">Inicio</a>
            <a href="#">Menú</a>
            <a href="#">Promociones</a>
            <a href="#">Contacto</a>
        </div>
    </div>
    <section class="hero">
    <h1>Las mejores hamburguesas hechas con precisión</h1>
    <p>Nuestras hamburguesas son deliciosas, rápidas y con las mejores máquinas del mercado</p>
    <button>Ordenar ahora</button>
    </section>

</body>
</html>
