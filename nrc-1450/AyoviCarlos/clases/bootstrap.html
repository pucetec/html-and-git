<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ejercicio Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container py-4">

  <h1 class="mb-4">Ejercicio Bootstrap 5</h1>

  <!-- 1. GRID -->
  <h3>1. Sistema de Grid</h3>
  <div class="row mb-4 text-center">
    <div class="col-6 bg-primary text-white p-3">col-6</div>
    <div class="col-6 bg-secondary text-white p-3">col-6</div>
  </div>
  <div class="row mb-4 text-center">
    <div class="col-4 bg-success text-white p-3">col-4</div>
    <div class="col-4 bg-warning text-white p-3">col-4</div>
    <div class="col-4 bg-danger text-white p-3">col-4</div>
  </div>

  <!-- 2. BOTONES -->
  <h3>2. Botones</h3>
  <div class="mb-4">
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-success">Success</button>
  </div>

  <!-- 3. FORMULARIO -->
  <h3>3. Formulario</h3>
  <div class="mb-4" style="max-width: 400px;">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" placeholder="Tu nombre">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" placeholder="correo@ejemplo.com">
    </div>
    <button class="btn btn-primary">Enviar</button>
  </div>

  <!-- 4. BADGES Y ALERTAS -->
  <h3>4. Badges y Alertas</h3>
  <div class="mb-3">
    <span class="badge bg-primary">Nuevo</span>
    <span class="badge bg-success">Activo</span>
    <span class="badge bg-danger">Error</span>
  </div>
  <div class="alert alert-primary">¡Esto es una alerta de Bootstrap!</div>
  <div class="alert alert-danger">Algo salió mal.</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
